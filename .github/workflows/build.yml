name: build-an7581

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本（要跟设备 uname -r 完全一致）'
        required: true
        default: '6.18.55'

env:
  KVER: ${{ github.event.inputs.kernel_version || '6.18.55' }}
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    # 24.04 自带 gcc-13 交叉工具链，比 22.04 的 gcc-11 更贴近 6.18 的构建要求
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装交叉工具链与内核构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential bc flex bison libssl-dev libelf-dev \
            xz-utils kmod rsync
          aarch64-linux-gnu-gcc --version | head -1

      - name: 缓存内核源码
        id: kcache
        uses: actions/cache@v4
        with:
          path: ~/kernel/linux-${{ env.KVER }}
          key: kernel-src-${{ env.KVER }}-v1

      - name: 下载并解压内核源码
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/kernel && cd ~/kernel
          URL="https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KVER}.tar.xz"
          echo "downloading $URL"
          curl -fL --retry 3 --retry-delay 3 -o linux-${KVER}.tar.xz "$URL"
          tar -xf linux-${KVER}.tar.xz
          rm -f linux-${KVER}.tar.xz
          ls -d ~/kernel/linux-${KVER}

      - name: 生成 .config（OpenWrt generic + target 合并）
        run: |
          # 用 bash 显式调用：Windows 上提交的脚本可能丢失可执行位
          KERNEL_DIR=$HOME/kernel/linux-${KVER} bash ./scripts/ci-prep-config.sh

      - name: modules_prepare
        run: |
          make -C $HOME/kernel/linux-${KVER} \
            ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            -j$(nproc) modules_prepare

      - name: 打印 vermagic 预期值
        run: |
          make -s -C $HOME/kernel/linux-${KVER} ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} kernelrelease

      - name: 准备 DVB 栈源码
        run: |
          KERNEL_DIR=$HOME/kernel/linux-${KVER} NO_RC=1 bash ./scripts/prepare-src.sh

      - name: 诊断：给 dvb-core 打 printk（TEMP）
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys

          def after(s, anchor, text):
              i = s.find(anchor)
              if i < 0:
                  print("MISS:", anchor, file=sys.stderr); sys.exit(1)
              j = i + len(anchor)
              return s[:j] + text + s[j:]

          def before(s, anchor, text):
              i = s.find(anchor)
              if i < 0:
                  print("MISS:", anchor, file=sys.stderr); sys.exit(1)
              return s[:i] + text + s[i:]

          p = pathlib.Path("kern/dvb-core/dvbdev.c")
          s = p.read_text()
          s = after(s, "unsigned int minor = iminor(inode);",
                    "\n\tpr_info(\"dvbdiag: inode=%px finode=%px mode=%#x ino=%lu rdev=%#x sizeof=%zu off=%zu\\n\",\n\t\tinode, file->f_inode, (unsigned int)inode->i_mode, inode->i_ino,\n\t\t(unsigned int)inode->i_rdev, sizeof(struct inode),\n\t\toffsetof(struct inode, i_rdev));")
          s = after(s, "dvbdev = dvb_minors[minor];",
                    "\n\tpr_info(\"dvbdiag: minor=%u dvbdev=%px fops=%px\\n\",\n\t\tminor, dvbdev, dvbdev ? dvbdev->fops : NULL);")
          s = after(s, "new_fops = fops_get(dvbdev->fops);",
                    "\n\t\tpr_info(\"dvbdiag: fops_get=%s owner=%px\\n\",\n\t\t\tnew_fops ? \"ok\" : \"FAIL\", dvbdev->fops->owner);")
          p.write_text(s)

          f = pathlib.Path("kern/dvb-core/dvb_frontend.c")
          t = f.read_text()
          t = before(t, "if (fe->exit == DVB_FE_DEVICE_REMOVED)",
                     "pr_info(\"dvbdiag: fe_open fe=%px exit=%d\\n\", fe, fe->exit);\n\t")
          f.write_text(t)
          print("dvb-core patched ok")
          PYEOF
          grep -n "dvbdiag" kern/dvb-core/dvbdev.c kern/dvb-core/dvb_frontend.c

      - name: 编译模块
        run: |
          set -o pipefail   # 否则 tee 会吞掉 make 的失败码
          make KERNEL_DIR=$HOME/kernel/linux-${KVER} \
            ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} \
            NO_RC=1 KBUILD_MODPOST_WARN=1 -j$(nproc) 2>&1 | tee build.log

      - name: 诊断：关键 CONFIG 与 struct module 大小
        if: always()
        run: |
          set -uo pipefail
          K=$HOME/kernel/linux-${KVER}/.config
          cp -f "$K" ./kernel.config || true
          echo "===== 影响 struct module 布局的开关 ====="
          for k in TRACEPOINTS TRACING EVENT_TRACING DYNAMIC_FTRACE FUNCTION_TRACER \
                   KPROBES LIVEPATCH BPF_EVENTS KUNIT TREE_SRCU JUMP_LABEL KALLSYMS \
                   DEBUG_INFO_BTF_MODULES PRINTK_INDEX GENERIC_BUG SMP SYSFS \
                   MODULE_SIG MODULE_UNLOAD STACKTRACE_BUILD_ID HAVE_STATIC_CALL_INLINE \
                   ARCH_USES_CFI_TRAPS MODULES_TREE_LOOKUP MODULE_DEBUG MODULE_STATS \
                   PERF_EVENTS TRACING CFI ARM_PMU HW_PERF_EVENTS EXPERT; do
            v=$(grep -E "^(CONFIG_${k}=|# CONFIG_${k} is not set)" "$K" | head -1 || true)
            printf "   %-26s %s\n" "$k" "${v:-<absent>}"
          done
          echo "===== .gnu.linkonce.this_module 段大小（设备要求 704）====="
          if [ -f dvb-core.ko ]; then
            aarch64-linux-gnu-objdump -h dvb-core.ko | grep -E "this_module" || true
            aarch64-linux-gnu-objdump -r -j .gnu.linkonce.this_module dvb-core.ko || true
          else
            echo "no dvb-core.ko"
          fi

      - name: 诊断：struct module 字段偏移（pahole）
        if: always()
        run: |
          if [ ! -f dvb-core.ko ]; then echo "no ko"; exit 0; fi
          sudo apt-get install -y -qq dwarves >/dev/null 2>&1 || true
          for t in module mod_kallsyms module_memory mod_arch_specific module_kobject inode; do
            echo "===== struct $t ====="
            pahole -C "$t" dvb-core.ko 2>&1 | head -80 || true
          done

      - name: 校验产物
        run: |
          echo "===== 校验产物 ====="
          set -euo pipefail
          ls -l *.ko
          for f in *.ko; do
            echo "=== $f ==="
            file "$f"
            strings -a "$f" | grep -i '^vermagic=' || true
            aarch64-linux-gnu-objdump -f "$f" | grep -E 'architecture|format' || true
          done
          echo "===== struct module 大小必须 == 704 (0x2c0) ====="
          hex=$(aarch64-linux-gnu-objdump -h dvb-core.ko | awk '$2==".gnu.linkonce.this_module"{print $3}')
          dec=$((16#$hex))
          echo "   .gnu.linkonce.this_module = 0x$hex = $dec"
          if [ "$dec" -ne 704 ]; then
            echo "!! 与设备内核的 struct module 大小不一致，insmod 会失败"
            exit 1
          fi

      - name: 上传 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvb-usb-smit-an7581-k${{ env.KVER }}
          path: |
            *.ko
            build.log
            kernel.config
          if-no-files-found: error
